# Clean-URL routing for the static multi-page ARCON Growth site.
# Netlify already serves e.g. about.html automatically at both /about and /about/
# with no config needed — these rules only redirect the OLD .html URLs to the
# clean form, so there's one canonical URL per page (and no redirect loops).

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/companies.html"
  to = "/companies/"
  status = 301
  force = true

[[redirects]]
  from = "/ca-services.html"
  to = "/ca-services/"
  status = 301
  force = true

[[redirects]]
  from = "/plastic.html"
  to = "/plastic/"
  status = 301
  force = true

[[redirects]]
  from = "/funding.html"
  to = "/funding/"
  status = 301
  force = true

[[redirects]]
  from = "/technology.html"
  to = "/technology/"
  status = 301
  force = true

[[redirects]]
  from = "/clients.html"
  to = "/clients/"
  status = 301
  force = true

[[redirects]]
  from = "/partners.html"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
  force = true

# Source/dev files that live in the project folder for editing but were never
# meant to be public routes. Blocked as 404s rather than deleted from the repo.
[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# ---------- Security headers ----------
# Built from the site's actual dependencies: Google Fonts (fonts.googleapis.com /
# fonts.gstatic.com), GSAP + ScrollTrigger via cdnjs.cloudflare.com, and the
# Google Apps Script enquiry endpoint (script.google.com, redirecting to
# script.googleusercontent.com). CSP ships in Report-Only mode first — check the
# browser console on the live site for any "would have blocked" warnings, then
# switch the key below to `Content-Security-Policy` once it's confirmed clean.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
